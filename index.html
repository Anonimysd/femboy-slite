<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>вопрос</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: radial-gradient(circle at 30% 40%, #1a0b1e, #0d0510);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Arial', system-ui, sans-serif;
            padding: 20px;
        }
        .card {
            background: rgba(25, 10, 30, 0.75);
            backdrop-filter: blur(12px);
            border: 2px solid #ff66aa;
            border-radius: 48px;
            padding: 50px 60px 40px;
            box-shadow: 0 0 70px rgba(255, 80, 180, 0.5), inset 0 0 40px rgba(255, 100, 200, 0.2);
            text-align: center;
            max-width: 900px;
            transition: 0.2s;
            position: relative;
        }
        .card:hover {
            box-shadow: 0 0 120px rgba(255, 80, 220, 0.8), inset 0 0 60px rgba(255, 120, 220, 0.3);
        }
        h1 {
            font-size: clamp(2.8rem, 12vw, 5.6rem);
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(145deg, #ffb3d9, #ff66b2, #ff3388);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 40px rgba(255, 50, 150, 0.6), 0 0 100px rgba(255, 20, 120, 0.3);
            line-height: 1.3;
            margin-bottom: 10px;
        }
        .emoji-big {
            font-size: clamp(3rem, 10vw, 5rem);
            display: block;
            margin: 10px 0 25px;
            filter: drop-shadow(0 0 30px #ff66aa);
            animation: pulse 1.8s ease-in-out infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-top: 15px;
            position: relative;
            min-height: 80px;
        }
        .btn {
            padding: 16px 48px;
            font-size: 2rem;
            font-weight: 700;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.15s;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
            min-width: 140px;
        }
        .btn-yes {
            background: linear-gradient(145deg, #ff88cc, #ff44aa);
            color: #1a0b1e;
            box-shadow: 0 0 30px #ff44aa88;
        }
        .btn-yes:hover {
            transform: scale(1.08);
            box-shadow: 0 0 60px #ff44aaff;
        }
        .btn-no {
            background: linear-gradient(145deg, #555, #222);
            color: #bbb;
            box-shadow: 0 0 10px #222;
            transition: all 0.08s ease;
            cursor: default;
            pointer-events: auto; /* мы управляем через JS */
        }
        .btn-no:active {
            pointer-events: none; /* страховка */
        }
        /* класс для "ускользания" */
        .btn-no.escape {
            position: fixed !important;
            transition: all 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 9999;
            transform: scale(0.6);
            opacity: 0.7;
            pointer-events: none;
            cursor: not-allowed;
            box-shadow: 0 0 5px #ff000066;
        }
        .btn-no.shrink {
            transform: scale(0.3) rotate(10deg);
            opacity: 0.2;
            pointer-events: none;
            cursor: not-allowed;
            min-width: 40px;
            padding: 8px 20px;
            font-size: 1rem;
        }
        .sub {
            margin-top: 30px;
            font-size: 1.2rem;
            color: #cc99bb;
            letter-spacing: 4px;
            text-transform: uppercase;
            border-top: 1px solid #ff66aa55;
            padding-top: 25px;
            font-weight: 300;
        }
        .sub span {
            color: #ff88cc;
            font-weight: 600;
        }
        #response-area {
            margin-top: 20px;
            font-size: 1.8rem;
            color: #ffbbdd;
            min-height: 3.5rem;
            text-shadow: 0 0 20px #ff44aa88;
        }
        @media (max-width: 480px) {
            .card { padding: 30px 20px; border-radius: 32px; }
            .btn { padding: 12px 28px; font-size: 1.5rem; min-width: 100px; }
            .buttons { gap: 20px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>отсосешь мне завтра, милый? :3</h1>
        <span class="emoji-big">💕👉👈💕</span>

        <div class="buttons" id="buttonContainer">
            <button class="btn btn-yes" id="btnYes">Да 💖</button>
            <button class="btn btn-no" id="btnNo">Нет 💔</button>
        </div>

        <div id="response-area"></div>
        <div class="sub"><span>★</span> выбери вариант <span>★</span></div>
    </div>

    <script>
        (function() {
            const btnYes = document.getElementById('btnYes');
            const btnNo = document.getElementById('btnNo');
            const response = document.getElementById('response-area');
            const container = document.getElementById('buttonContainer');

            // ---- Кнопка "Нет" никогда не даёт нажать ----
            function makeNoUnclickable() {
                // 1. Отключаем все стандартные события
                btnNo.onclick = null;
                btnNo.onmousedown = null;
                btnNo.onmouseup = null;
                btnNo.onpointerdown = null;
                btnNo.onpointerup = null;
                btnNo.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }, true);
                // 2. Блокируем через CSS-свойства
                btnNo.style.pointerEvents = 'none'; // основной метод
                // 3. Дополнительно делаем невидимым для кликов через стек
                btnNo.style.cursor = 'not-allowed';
                // 4. Постоянно меняем позицию если вдруг стали доступны
                setInterval(() => {
                    // если по какой-то причине pointerEvents сбросился — восстанавливаем
                    if (btnNo.style.pointerEvents !== 'none') {
                        btnNo.style.pointerEvents = 'none';
                    }
                    // мелкое дрожание для усиления эффекта (опционально)
                    const x = (Math.random() - 0.5) * 6;
                    const y = (Math.random() - 0.5) * 6;
                    btnNo.style.transform = `translate(${x}px, ${y}px) scale(0.95)`;
                }, 100);
            }

            // ---- Эффекты при наведении на "Нет" ----
            btnNo.addEventListener('mouseenter', function(e) {
                // улетает в случайную сторону
                const rect = this.getBoundingClientRect();
                const maxX = window.innerWidth - rect.width - 20;
                const maxY = window.innerHeight - rect.height - 20;
                const newX = Math.max(10, Math.min(maxX, Math.random() * maxX));
                const newY = Math.max(10, Math.min(maxY, Math.random() * maxY));
                this.style.position = 'fixed';
                this.style.left = newX + 'px';
                this.style.top = newY + 'px';
                this.style.transform = 'scale(0.7) rotate(' + (Math.random()*20-10) + 'deg)';
                this.style.opacity = '0.5';
                this.style.transition = 'all 0.1s ease';
                // дополнительно меняем текст на "Попробуй ещё"
                this.textContent = '😵';
                setTimeout(() => {
                    this.textContent = 'Нет 💔';
                }, 300);
                // убираем pointer-events на время, чтобы не поймали
                this.style.pointerEvents = 'none';
                setTimeout(() => {
                    this.style.pointerEvents = 'none'; // навсегда
                }, 50);
            });

            // ---- Кнопка "Да" ----
            btnYes.addEventListener('click', function() {
                response.innerHTML = '😳💕 я жду завтра... целую 💋';
                response.style.color = '#ff88dd';
                // анимация
                btnYes.style.transform = 'scale(1.2)';
                setTimeout(() => btnYes.style.transform = 'scale(1)', 200);
                // блокируем "Нет" окончательно
                btnNo.style.pointerEvents = 'none';
                btnNo.style.opacity = '0.2';
                btnNo.style.transform = 'scale(0.3) rotate(20deg)';
                btnNo.textContent = '💔';
            });

            // ---- Дополнительная защита: если кто-то пытается кликнуть по "Нет" через клавиатуру или тап - игнор ----
            btnNo.addEventListener('touchstart', function(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }, { passive: false });

            // ---- Запуск защиты ----
            makeNoUnclickable();

            // ---- На случай ресайза: возвращаем "Нет" на место если он улетел ----
            window.addEventListener('resize', function() {
                if (btnNo.style.position === 'fixed') {
                    btnNo.style.position = 'relative';
                    btnNo.style.left = 'auto';
                    btnNo.style.top = 'auto';
                    btnNo.style.transform = 'scale(0.95)';
                    btnNo.style.opacity = '0.7';
                }
            });

            // ---- Дополнительно: "Нет" уменьшается при любой попытке взаимодействия ----
            document.addEventListener('mousemove', function(e) {
                const rect = btnNo.getBoundingClientRect();
                const cx = rect.left + rect.width/2;
                const cy = rect.top + rect.height/2;
                const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
                if (dist < 150) {
                    // убегает ещё дальше
                    const angle = Math.atan2(e.clientY - cy, e.clientX - cx);
                    const shift = 120;
                    const newX = Math.min(window.innerWidth - 100, Math.max(10, rect.left + Math.cos(angle) * shift));
                    const newY = Math.min(window.innerHeight - 100, Math.max(10, rect.top + Math.sin(angle) * shift));
                    btnNo.style.position = 'fixed';
                    btnNo.style.left = newX + 'px';
                    btnNo.style.top = newY + 'px';
                    btnNo.style.transform = 'scale(0.4) rotate(' + (Math.random()*30-15) + 'deg)';
                    btnNo.style.opacity = '0.3';
                    btnNo.style.pointerEvents = 'none';
                }
            });

            console.log('FEMBOY INJECTOR: кнопка "Нет" полностью неуязвима.');
        })();
    </script>
</body>
</html>
